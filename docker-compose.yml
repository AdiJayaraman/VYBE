# Local development services for VYBE.
#   docker compose up -d
# Matches DATABASE_URL in packages/database/.env.
services:
  postgres:
    image: postgres:16-alpine
    container_name: vybe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vybe
    ports:
      - '5432:5432'
    volumes:
      - vybe-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vybe']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: required only when scaling the Socket.IO gateway across
  # multiple API instances (redis adapter) — see README.
  redis:
    image: redis:7-alpine
    container_name: vybe-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - vybe-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vybe-postgres-data:
  vybe-redis-data:
